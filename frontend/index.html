<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">💰 Expense Tracker</span>
    </div>
  </nav>

  <main class="container pb-5">

    <!-- Alerts are added here by JavaScript -->
    <div id="alertBox"></div>

    <!-- Summary cards (laid out with CSS Grid, see style.css) -->
    <section class="summary-grid mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-subtitle text-muted mb-2">Total amount</h6>
          <p class="card-text fs-3 fw-bold mb-0" id="totalAmount">-</p>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-subtitle text-muted mb-2">Number of expenses</h6>
          <p class="card-text fs-3 fw-bold mb-0" id="expenseCount">-</p>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-subtitle text-muted mb-2">Highest expense</h6>
          <p class="card-text fs-3 fw-bold mb-0" id="highestAmount">-</p>
          <small class="text-muted" id="highestTitle">&nbsp;</small>
        </div>
      </div>
    </section>

    <div class="row g-4">

      <!-- Add form -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Add expense</h5>
            <form id="addForm" novalidate>
              <div class="mb-3">
                <label for="addTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="addTitle" maxlength="100">
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="addAmount" class="form-label">Amount</label>
                <input type="number" class="form-control" id="addAmount" step="0.01">
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="addCategory" class="form-label">Category</label>
                <select class="form-select" id="addCategory"></select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="addDate" class="form-label">Date</label>
                <input type="date" class="form-control" id="addDate">
                <div class="invalid-feedback"></div>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="addBtn">Add expense</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Filter + table -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h5 class="card-title mb-0">Expenses</h5>
              <div class="d-flex align-items-center gap-2">
                <label for="filterCategory" class="form-label mb-0">Category</label>
                <select class="form-select form-select-sm w-auto" id="filterCategory"></select>
              </div>
            </div>

            <div id="spinner" class="text-center py-4 d-none">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="expenseBody"></tbody>
              </table>
            </div>
            <p id="emptyMessage" class="text-muted text-center my-3 d-none">No expenses to show.</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Edit modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" maxlength="100">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="editAmount" step="0.01">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>
              <select class="form-select" id="editCategory"></select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate">
              <div class="invalid-feedback"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="editBtn">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
